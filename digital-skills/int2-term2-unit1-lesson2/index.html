<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحدّي الفرز والتصفية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: بطاقات تقويم صفية هادئة، تُفهم بالنظر دون صوت
   IDEA: بطاقة «وقفة تقويم» المطبوعة: خلفية خضراء مخططة وبطاقة بيضاء بحواف داكنة
   PICTURE: البطاقة نفسها هي لوحة اللعب
   COLOUR and TYPE: أخضر مريمي مخطط، أبيض، أزرق #2f5fe0 للعناوين الصغيرة، أخضر وأحمر للتغذية الراجعة، Tajawal
   LAYOUT: بطاقة واحدة بعرض 820px في الوسط، أزرار 56px */
:root{color-scheme:light;--s1:#8cbfb3;--s2:#7cb1a5;--card:#fff;--box:#fffdf6;--ink:#1d1d24;--soft:#6b7280;--blue:#2f5fe0;--ok:#22a06b;--no:#e5484d;--row:#ffe27a;--col:#a8d8ff;--sun:#f5b800}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;color:var(--ink);font:18px/1.6 "Tajawal",Tahoma,sans-serif;background:repeating-linear-gradient(90deg,var(--s1) 0 34px,var(--s2) 34px 68px);overflow-x:clip;display:flex;align-items:center}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{width:min(100%,860px);margin:0 auto;padding:clamp(14px,3vw,30px)}
.card{background:var(--card);border-radius:30px;padding:clamp(18px,3.5vw,34px);box-shadow:0 10px 30px rgba(20,60,50,.18);min-height:420px;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.lab{display:flex;align-items:center;gap:8px}
.q{width:46px;height:46px;border-radius:50%;background:var(--blue);border:2.5px solid var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.pill{background:var(--blue);color:#fff;border-radius:10px;padding:5px 16px;font-weight:700;font-size:16px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1.5px solid var(--ink);border-radius:99px;padding:1px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.box{background:var(--box);border:1.5px solid var(--ink);border-radius:18px;padding:16px 20px}
.prompt{font-size:clamp(20px,3.6vw,26px);font-weight:800;text-align:center;line-height:1.4}
.area{margin-top:14px;flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center}
.show{display:grid;place-items:center}
.chip{border:2px dashed var(--blue);border-radius:16px;padding:12px 24px;font-size:clamp(20px,3.6vw,26px);font-weight:700;text-align:center;background:#fff}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.opt{background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:12px;font-size:19px;font-weight:700;min-height:56px;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.opt.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--no);color:#fff;border-color:var(--no)}
.bad,.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fb{min-height:40px;text-align:center;font-size:22px;font-weight:800}
.fb.y{color:var(--ok)}.fb.n{color:var(--no)}
.main{background:var(--blue);color:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 34px;font-size:21px;font-weight:800;min-height:56px;box-shadow:0 4px 0 var(--ink)}
.main:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.link{background:none;color:var(--soft);font-size:16px;padding:6px 8px;text-decoration:underline}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.goal{text-align:center}
.goal h2{font-size:clamp(26px,4.6vw,38px);line-height:1.15;margin:4px 0 12px}
.rule{font-size:20px;line-height:1.7;text-align:center}
.rule b{color:var(--blue)}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stop{background:var(--box);border:1.5px solid var(--ink);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:right;color:var(--ink)}
.stop .q{width:40px;height:40px;font-size:18px}
.stop.lock{opacity:.45;cursor:not-allowed}
.stop.lock .q{background:#bbb}
.stop b{display:block;font-size:17px;line-height:1.3}
.st{display:flex;gap:2px}
.star{width:20px;height:20px;fill:var(--sun)}.star.off{fill:#d9d9d9}
.who{font-size:16px;color:var(--soft);text-align:center;margin-bottom:10px}
.who b{color:var(--ink)}
.field{display:grid;gap:6px;max-width:420px;margin:0 auto 14px;width:100%}
.field label{font-weight:700}
.field input,.field select{border:1.5px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:18px;background:#fff;color:var(--ink);min-height:50px}
.err{color:var(--no);text-align:center;min-height:28px;font-weight:700}
table{border-collapse:separate;border-spacing:4px;width:100%;font-size:19px}
th,td{background:#fff;border:1.5px solid var(--ink);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer}
th{background:var(--blue);color:#fff}
td.r{background:var(--row)}td.c,th.c{background:var(--col);color:var(--ink)}
.legend{display:flex;justify-content:center;gap:16px;font-size:16px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink)}
.line{display:flex;flex-direction:column;gap:6px}
.line div{background:var(--ok);color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;display:flex;gap:10px;align-items:center}
.line div em{font-style:normal;background:#fff;color:var(--ok);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:none}
.form{width:min(100%,340px);background:#fff;border:1.5px solid var(--ink);border-radius:14px;padding:14px;text-align:right}
.form label{font-weight:700}.form label b{color:var(--no)}
.form .in{border:1.5px solid #9aa;border-radius:10px;padding:6px 12px;margin:8px 0;font-size:22px;min-height:46px;direction:ltr;text-align:right}
.form .lim{display:inline-block;background:#e8efff;border-radius:8px;padding:2px 10px;font-size:15px}
.dots{display:flex;gap:5px}.dots i{width:12px;height:12px;border-radius:50%;background:#d9d9d9;border:1.5px solid var(--ink)}.dots i.on{background:var(--blue)}
.res{text-align:center}
.res h2{font-size:clamp(26px,4.6vw,36px);margin:0}
.score{font-size:clamp(44px,9vw,68px);font-weight:800;color:var(--blue);line-height:1.1}
.rt{width:100%;font-size:16px;margin-top:10px}
.rt td,.rt th{cursor:default;padding:6px}
.rt td:first-child{text-align:right}
.copy{margin-top:auto;padding-top:16px;font-size:13px;color:var(--soft);text-align:right}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.info div{background:var(--box);border:1.5px solid var(--ink);border-radius:14px;padding:8px 14px;font-size:16px}
.info span{display:block;color:var(--soft);font-size:13px}
.info b{font-size:17px}
@media(max-width:600px){.info{grid-template-columns:minmax(0,1fr)}}
.how{margin:0;padding:0 22px 0 0;font-size:17px;line-height:1.8}
.how b{color:var(--blue)}
.logo{height:48px;border-radius:12px;background:#334155;padding:5px 10px;display:flex;align-items:center;flex:none;border:2px solid var(--ink)}
.logo img{height:100%;width:auto;display:block}
.mini{border-collapse:separate;border-spacing:3px;font-size:15px;width:auto;margin:0 auto}
.mini th,.mini td{padding:4px 10px;cursor:default;border-width:1px}
.mini tr.hi td,.mini td.hc,.mini th.hc{background:var(--row);color:var(--ink)}
.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.flow>div{display:flex;flex-direction:column;align-items:center;gap:4px}
.flow small{font-size:14px;font-weight:700;color:var(--blue)}
.arr{font-size:28px;font-weight:800;color:var(--blue)}
.big3{display:flex;justify-content:center;gap:6px}.big3 svg{width:54px;height:54px}
@media(max-width:600px){.map{grid-template-columns:minmax(0,1fr)}table{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div id="app" style="flex:1;display:flex;flex-direction:column"></div><div class="copy">© مايند | Mind · موارد إبداعية لتعليم مُلهم · جميع الحقوق محفوظة · نسخة مجانية · يُمنع بيعها</div></div></div>
<script>
{

const bar=(num,label,tags)=>`<div class="bar"><div class="lab">${num==='م'?LOGO:`<span class="q">${num}</span>`}<span class="pill">${label}</span></div><div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`;
const who=()=>`<div class="who">الطالبة: <b>${esc(st.name)}</b> · الفصل: <b>${esc(st.cls)}</b></div>`;
const INFO=`<div class="info"><div><span>المادة</span><b>المهارات الرقمية</b></div><div><span>الصف</span><b>الثاني المتوسط</b></div><div><span>الفصل الدراسي</span><b>الفصل الدراسي الثاني</b></div><div><span>الوحدة</span><b>الوحدة الأولى: جمع المعلومات</b></div><div style="grid-column:1/-1"><span>الدرس</span><b>الدرس الثاني: التعامل مع قاعدة البيانات</b></div></div>`;
function start(){
 app.innerHTML=bar('م','تحدّي الفرز والتصفية',['المهارات الرقمية'])+INFO+`<div class="box"><div class="prompt" style="margin-bottom:6px">تعليمات اللعبة</div><ol class="how"><li>اكتبي اسمكِ وفصلكِ ثم اضغطي <b>ابدئي المغامرة</b>.</li><li>في اللعبة <b>ثماني محطات</b>، كل محطة تمثّل هدفاً من أهداف الدرس.</li><li>اقرئي <b>هدف المحطة</b> والتعريف قبل البدء.</li><li>اختاري الإجابة: <span style="color:var(--ok);font-weight:700">الأخضر</span> إجابة صحيحة، و<span style="color:var(--no);font-weight:700">الأحمر</span> حاولي مرة أخرى.</li><li>تحصلين على <b>ثلاث نجوم</b> إذا أجبتِ دون أخطاء، وتُفتح المحطة التالية بعد إنهاء السابقة.</li><li>بعد المحطة الثامنة تظهر <b>نتيجتكِ النهائية</b>؛ اعرضيها على معلمتكِ.</li></ol></div><div class="area"><div class="field"><label for="nm">اسم الطالبة</label><input id="nm" autocomplete="off" value="${esc(st.name)}"></div><div class="field"><label for="cl">الفصل</label><input id="cl" autocomplete="off" placeholder="مثال: 3/2" value="${esc(st.cls)}"></div><div class="err" id="er"></div><div class="row" style="margin:0"><button class="main" id="go">ابدئي المغامرة</button>${st.name?'<button class="link" id="nw0">طالبة جديدة</button>':''}</div>${st.name?`<div class="who" style="margin:0">محفوظ لـ ${esc(st.name)}: ${total()} نجمة من 24</div>`:''}</div>`;
 const n0=document.getElementById('nw0');if(n0)n0.onclick=()=>{st={name:'',cls:'',stars:[]};save();start()};
 document.getElementById('go').textContent=st.name?'متابعة':'ابدئي المغامرة';document.getElementById('go').onclick=()=>{const n=document.getElementById('nm').value.trim(),c=document.getElementById('cl').value.trim();
  if(!n||!c){document.getElementById('er').textContent='اكتبي الاسم والفصل أولاً';return}
  if(n!==st.name||c!==st.cls)st={name:n,cls:c,stars:[]};save();map()};
}
function map(){
 const open=i=>i===0||st.stars[i-1]>0;
 const all=st.stars.filter(x=>x>0).length===L.length;
 app.innerHTML=bar('م','خريطة المحطات',[`${total()} / 24 نجمة`])+INFO+who()+`<div class="map">${L.map((l,i)=>`<button class="stop${open(i)?'':' lock'}" data-i="${i}"><span class="q">${i+1}</span><span><b>${l.t}</b><span class="st">${starRow(st.stars[i]||0)}</span></span></button>`).join('')}</div><div class="row">${all?'<button class="main" id="rs">عرض النتيجة</button>':''}<button class="link" id="nw">طالبة جديدة</button></div>`;
 app.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(open(i))intro(i)});
 const r=document.getElementById('rs');if(r)r.onclick=result;
 document.getElementById('nw').onclick=()=>{st={name:'',cls:'',stars:[]};save();start()};
}
function intro(i){
 cur=i;const l=L[i];
 app.innerHTML=bar(i+1,'هدف المحطة',[`المحطة ${i+1} من 8`])+`<div class="goal"><h2>${l.goal}</h2></div><div class="box rule">${l.rule}${l.ex?`<div style="margin-top:12px;padding-top:12px;border-top:1.5px dashed #ccc"><div style="font-size:15px;color:var(--soft);margin-bottom:6px">مثال</div>${l.ex}</div>`:''}</div><div class="row"><button class="main" id="go">ابدئي</button></div><div class="row" style="margin-top:4px"><button class="link" id="bk">العودة للخريطة</button></div>`;
 document.getElementById('go').onclick=()=>{step=0;miss=0;if(l.type==='order'){order=shuffle(l.steps);picked=0}play()};
 document.getElementById('bk').onclick=map;
}
function fb(ok){const f=document.getElementById('fb');f.className='fb '+(ok?'y':'n');f.textContent=ok?'أحسنتِ، إجابة صحيحة ✓':'حاولي مرة أخرى ✗'}
function next(len){busy=true;setTimeout(()=>{busy=false;step++;step>=len?finish():play()},900)}
function frame(prompt,body,n,of){
 return bar(cur+1,L[cur].t,[`<span class="dots">${Array.from({length:of},(_,k)=>`<i class="${k<n?'on':''}"></i>`).join('')}</span>`])+`<div class="box prompt">${prompt}</div><div class="area">${body}<div class="fb" id="fb" aria-live="polite"></div></div><div class="row" style="margin-top:0"><button class="link" id="bk">العودة للخريطة</button></div>`;
}
function play(){
 const l=L[cur];
 if(l.type==='quiz'){
  const r=l.rounds[step];
  app.innerHTML=frame(r.p,`${r.v?`<div class="show">${r.v}</div>`:''}<div class="opts">${r.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`,step,l.rounds.length);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(busy)return;const ok=+b.dataset.k===r.a;b.classList.remove('bad');void b.offsetWidth;b.classList.add(ok?'good':'bad');fb(ok);if(ok)next(l.rounds.length);else miss++});
 }else if(l.type==='table'){
  const r=l.rounds[step];
  app.innerHTML=frame(r.p,`<div style="overflow-x:auto"><table id="tb"><thead><tr>${l.head.map((h,c)=>`<th data-r="-1" data-c="${c}">${h}</th>`).join('')}</tr></thead><tbody>${l.rows.map((row,ri)=>`<tr>${row.map((v,c)=>`<td data-r="${ri}" data-c="${c}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="legend"><span><i style="background:var(--row)"></i>السجل = صف</span><span><i style="background:var(--col)"></i>الحقل = عمود</span></div>`,step,l.rounds.length);
  const tb=document.getElementById('tb');
  tb.onclick=e=>{const cell=e.target.closest('td,th');if(!cell||busy)return;const ri=+cell.dataset.r,c=+cell.dataset.c;
   const ok=r.k==='r'?ri===r.i:c===r.i;
   if(ok)tb.querySelectorAll('td,th').forEach(x=>{if(r.k==='r'&&+x.dataset.r===r.i)x.classList.add('r');if(r.k==='c'&&+x.dataset.c===r.i)x.classList.add('c')});
   else{miss++;tb.classList.remove('shake');void tb.offsetWidth;tb.classList.add('shake')}
   fb(ok);if(ok)next(l.rounds.length)};
 }else if(l.type==='pick'){
  const r=l.rounds[step];let sel=new Set();
  app.innerHTML=frame(r.p,`<div style="overflow-x:auto"><table id="tb"><thead><tr>${TB.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${TB.rows.map((row,ri)=>`<tr data-r="${ri}">${row.map(v=>`<td data-r="${ri}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="legend"><span><i style="background:var(--row)"></i>سجل اخترتِه</span></div><div class="row" style="margin:0"><button class="main" id="ck">تحقّقي</button></div>`,step,l.rounds.length);
  const tb=document.getElementById('tb');
  tb.onclick=e=>{const c=e.target.closest('td');if(!c||busy)return;const ri=+c.dataset.r;sel.has(ri)?sel.delete(ri):sel.add(ri);tb.querySelectorAll(`td[data-r="${ri}"]`).forEach(x=>x.classList.toggle('r',sel.has(ri)))};
  document.getElementById('ck').onclick=()=>{if(busy)return;const ok=sel.size===r.ans.length&&r.ans.every(x=>sel.has(x));
   if(ok)next(l.rounds.length);else{miss++;tb.classList.remove('shake');void tb.offsetWidth;tb.classList.add('shake')}
   const f=document.getElementById('fb');f.className='fb '+(ok?'y':'n');f.textContent=ok?'أحسنتِ، هذه السجلات الصحيحة ✓':'راجعي الشرط وحاولي مرة أخرى ✗'};
 }else{
  app.innerHTML=frame(l.p,`${l.v?tbl():''}<div class="line">${l.steps.slice(0,picked).map((s,k)=>`<div><em>${k+1}</em>${s}</div>`).join('')}</div><div class="opts">${order.filter(s=>l.steps.indexOf(s)>=picked).map(s=>`<button class="opt" data-s="${l.steps.indexOf(s)}">${s}</button>`).join('')}</div>`,picked,l.steps.length);
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(busy)return;const ok=+b.dataset.s===picked;
   if(ok){picked++;if(picked>=l.steps.length){play();step=l.steps.length-1;fb(true);next(l.steps.length)}else play()}
   else{miss++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');fb(false)}});
 }
 document.getElementById('bk').onclick=map;
}
function finish(){
 const n=miss===0?3:miss<=2?2:1;st.stars[cur]=Math.max(st.stars[cur]||0,n);save();
 const last=cur===L.length-1;
 app.innerHTML=bar(cur+1,'انتهت المحطة',[L[cur].t])+`<div class="res"><h2>${n===3?'ممتاز':n===2?'رائع':'أحسنتِ'}</h2><div class="big3">${starRow(n)}</div></div><div class="box rule">حقّقتِ الهدف: <b>${L[cur].goal}</b></div><div class="row">${last?'<button class="main" id="rs">عرض النتيجة</button>':'<button class="main" id="nx">المحطة التالية</button>'}<button class="opt" id="ag">إعادة المحطة</button><button class="opt" id="mp">الخريطة</button></div>`;
 const nx=document.getElementById('nx');if(nx)nx.onclick=()=>intro(cur+1);
 const r=document.getElementById('rs');if(r)r.onclick=result;
 document.getElementById('ag').onclick=()=>intro(cur);
 document.getElementById('mp').onclick=map;
}
function result(){
 const t=total(),pct=Math.round(t/24*100);
 const lvl=pct>=90?'متميزة':pct>=75?'متقدمة':pct>=60?'متمكنة':'تحتاج إلى دعم';
 const d=new Date().toLocaleDateString('ar-SA');
 app.innerHTML=bar('✓','النتيجة النهائية',['المهارات الرقمية',d])+INFO+`<div class="res"><div class="box"><div style="font-size:20px">الطالبة: <b>${esc(st.name)}</b> &nbsp;·&nbsp; الفصل: <b>${esc(st.cls)}</b></div><div class="score">${t} / 24</div><div style="font-size:20px;font-weight:700">${pct}% · المستوى: <span style="color:var(--blue)">${lvl}</span></div></div><table class="rt"><thead><tr><th>الهدف</th><th>النجوم</th></tr></thead><tbody>${L.map((l,i)=>`<tr><td>${i+1}. ${l.goal}</td><td><span class="st" style="justify-content:center">${starRow(st.stars[i]||0)}</span></td></tr>`).join('')}</tbody></table></div><div class="row"><button class="main" id="cp">نسخ النتيجة</button><button class="opt" id="mp">الخريطة</button><button class="opt" id="nw">طالبة جديدة</button></div><div class="err" id="ms" style="color:var(--ok)"></div>`;
 document.getElementById('cp').onclick=()=>{const txt=`${st.name}\t${st.cls}\t${t}/24\t${pct}%\t${lvl}`;
  const m=document.getElementById('ms');try{navigator.clipboard.writeText(txt).then(()=>m.textContent='نُسخت النتيجة، ألصقيها في كشف الدرجات',()=>m.textContent='تعذّر النسخ، التقطي صورة للشاشة')}catch(e){m.textContent='تعذّر النسخ، التقطي صورة للشاشة'}};
 document.getElementById('mp').onclick=map;
 document.getElementById('nw').onclick=()=>{st={name:'',cls:'',stars:[]};save();start()};
}
start();
}
</script>
</body>
</html>
